<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:#ffffff; display:flex; justify-content:center; align-items:center; }
  svg { width: 100%; max-width: 820px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06); }
</style>
</head>
<body>
<svg viewBox="0 0 760 380" width="100%" height="380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1e3a8a"/>
        <stop offset="1%" stop-color="#2563eb"/>
      </linearGradient>
      <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="1%" stop-color="#f1f5f9"/>
      </linearGradient>
      <filter id="drop" x="-5%" y="-5%" width="110%" height="110%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
      </filter>
    </defs>

    <!-- Center Hub -->
    <rect x="250" y="130" width="260" height="110" rx="12" fill="url(#blueGrad)" filter="url(#drop)"/>
    <text x="380" y="165" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="16">SYNAPSE BUILDOS</text>
    <text x="380" y="188" text-anchor="middle" fill="#93c5fd" font-size="12">Deterministic Geometry Kernel</text>
    <text x="380" y="208" text-anchor="middle" fill="#ffffff" font-size="11">Single Source of Truth (SVG / Feet)</text>

    <!-- Top Left: Brief Ingestion -->
    <rect x="40" y="30" width="180" height="85" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#drop)"/>
    <text x="130" y="58" text-anchor="middle" fill="#0f172a" font-weight="bold" font-size="13">Client Brief Ingestion</text>
    <text x="130" y="78" text-anchor="middle" fill="#475569" font-size="11">OCR / Docx / Natural Text</text>
    <text x="130" y="96" text-anchor="middle" fill="#2563eb" font-size="10">Kochi & Tamil Nadu Typologies</text>

    <!-- Top Right: 2D & 3D Studio -->
    <rect x="540" y="30" width="180" height="85" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#drop)"/>
    <text x="630" y="58" text-anchor="middle" fill="#0f172a" font-weight="bold" font-size="13">Visual CAD Studio</text>
    <text x="630" y="78" text-anchor="middle" fill="#475569" font-size="11">2D SVG Interactive Layout</text>
    <text x="630" y="96" text-anchor="middle" fill="#2563eb" font-size="10">Three.js r160 3D Walkthrough</text>

    <!-- Bottom Left: Automated Compliance & Cost -->
    <rect x="40" y="260" width="180" height="85" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#drop)"/>
    <text x="130" y="288" text-anchor="middle" fill="#0f172a" font-weight="bold" font-size="13">Rule & Cost Engines</text>
    <text x="130" y="308" text-anchor="middle" fill="#475569" font-size="11">TNCDBR 2019 Bylaw Checks</text>
    <text x="130" y="326" text-anchor="middle" fill="#16a34a" font-size="10">TN PWD 2025-26 Plinth Rates</text>

    <!-- Bottom Right: Cortex AI & Exports -->
    <rect x="540" y="260" width="180" height="85" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#drop)"/>
    <text x="630" y="288" text-anchor="middle" fill="#0f172a" font-weight="bold" font-size="13">Cortex AI & Multi-Export</text>
    <text x="630" y="308" text-anchor="middle" fill="#475569" font-size="11">Multi-lingual Prompt Copilot</text>
    <text x="630" y="326" text-anchor="middle" fill="#7c3aed" font-size="10">IFC4, DXF, OBJ, BOQ & PDF</text>

    <!-- Connectors -->
    <path d="M 180 115 L 260 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 580 115 L 500 145" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M 260 225 L 180 260" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M 500 225 L 580 260" fill="none" stroke="#64748b" stroke-width="2"/>
  </svg>
</body>
</html>
