<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:#ffffff; display:flex; justify-content:center; align-items:center; }
  svg { width: 100%; max-width: 820px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06); }
</style>
</head>
<body>
<svg viewBox="0 0 760 520" width="100%" height="520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
        <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
      </filter>
    </defs>

    <!-- Boundary System Box -->
    <rect x="220" y="30" width="340" height="460" rx="10" fill="#fafaf9" stroke="#94a3b8" stroke-width="2"/>
    <text x="390" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Synapse BuildOS Boundary</text>

    <!-- Left Actor: Client / Homeowner -->
    <!-- Head -->
    <circle cx="80" cy="120" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <!-- Body -->
    <line x1="80" y1="134" x2="80" y2="175" stroke="#1e293b" stroke-width="2"/>
    <!-- Arms -->
    <line x1="55" y1="148" x2="105" y2="148" stroke="#1e293b" stroke-width="2"/>
    <!-- Legs -->
    <line x1="80" y1="175" x2="60" y2="210" stroke="#1e293b" stroke-width="2"/>
    <line x1="80" y1="175" x2="100" y2="210" stroke="#1e293b" stroke-width="2"/>
    <text x="80" y="235" text-anchor="middle" font-size="11" font-weight="bold">Homeowner</text>
    <text x="80" y="248" text-anchor="middle" font-size="9" fill="#64748b">(Client)</text>

    <!-- Left Actor: Architect / Designer -->
    <circle cx="80" cy="330" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <line x1="80" y1="344" x2="80" y2="385" stroke="#1e293b" stroke-width="2"/>
    <line x1="55" y1="358" x2="105" y2="358" stroke="#1e293b" stroke-width="2"/>
    <line x1="80" y1="385" x2="60" y2="420" stroke="#1e293b" stroke-width="2"/>
    <line x1="80" y1="385" x2="100" y2="420" stroke="#1e293b" stroke-width="2"/>
    <text x="80" y="445" text-anchor="middle" font-size="11" font-weight="bold">Architect</text>
    <text x="80" y="458" text-anchor="middle" font-size="9" fill="#64748b">(Designer / Modeler)</text>

    <!-- Right Actor: Contractor / Engineer -->
    <circle cx="680" cy="230" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <line x1="680" y1="244" x2="680" y2="285" stroke="#1e293b" stroke-width="2"/>
    <line x1="655" y1="258" x2="705" y2="258" stroke="#1e293b" stroke-width="2"/>
    <line x1="680" y1="285" x2="660" y2="320" stroke="#1e293b" stroke-width="2"/>
    <line x1="680" y1="285" x2="700" y2="320" stroke="#1e293b" stroke-width="2"/>
    <text x="680" y="345" text-anchor="middle" font-size="11" font-weight="bold">Contractor</text>
    <text x="680" y="358" text-anchor="middle" font-size="9" fill="#64748b">(Estimator / Builder)</text>

    <!-- Use Cases Ovals -->
    <!-- UC1 -->
    <ellipse cx="390" cy="85" rx="100" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#soft)"/>
    <text x="390" y="89" text-anchor="middle" font-size="10">Submit Client Brief & Plot</text>

    <!-- UC2 -->
    <ellipse cx="390" cy="135" rx="100" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#soft)"/>
    <text x="390" y="139" text-anchor="middle" font-size="10">Select / Recommend Plan</text>

    <!-- UC3 -->
    <ellipse cx="390" cy="185" rx="100" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#soft)"/>
    <text x="390" y="189" text-anchor="middle" font-size="10">Edit 2D Rooms & Partitions</text>

    <!-- UC4 -->
    <ellipse cx="390" cy="235" rx="100" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#soft)"/>
    <text x="390" y="239" text-anchor="middle" font-size="10">View 3D Spatial Walkthrough</text>

    <!-- UC5 -->
    <ellipse cx="390" cy="285" rx="100" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#soft)"/>
    <text x="390" y="289" text-anchor="middle" font-size="10">Inspect TNCDBR 2019 Bylaws</text>

    <!-- UC6 -->
    <ellipse cx="390" cy="335" rx="100" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#soft)"/>
    <text x="390" y="339" text-anchor="middle" font-size="10">Audit PWD Plinth-Area Cost</text>

    <!-- UC7 -->
    <ellipse cx="390" cy="385" rx="100" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#soft)"/>
    <text x="390" y="389" text-anchor="middle" font-size="10">Execute Cortex AI Prompts</text>

    <!-- UC8 -->
    <ellipse cx="390" cy="435" rx="100" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#soft)"/>
    <text x="390" y="439" text-anchor="middle" font-size="10">Export IFC / DXF / PDF Dossier</text>

    <!-- Connections Homeowner -->
    <line x1="115" y1="140" x2="295" y2="88" stroke="#64748b" stroke-width="1.2"/>
    <line x1="115" y1="150" x2="295" y2="135" stroke="#64748b" stroke-width="1.2"/>
    <line x1="115" y1="165" x2="295" y2="235" stroke="#64748b" stroke-width="1.2"/>

    <!-- Connections Architect -->
    <line x1="115" y1="360" x2="295" y2="185" stroke="#64748b" stroke-width="1.2"/>
    <line x1="115" y1="370" x2="295" y2="240" stroke="#64748b" stroke-width="1.2"/>
    <line x1="115" y1="380" x2="295" y2="285" stroke="#64748b" stroke-width="1.2"/>
    <line x1="115" y1="390" x2="295" y2="385" stroke="#64748b" stroke-width="1.2"/>
    <line x1="115" y1="400" x2="295" y2="435" stroke="#64748b" stroke-width="1.2"/>

    <!-- Connections Contractor -->
    <line x1="645" y1="270" x2="485" y2="290" stroke="#64748b" stroke-width="1.2"/>
    <line x1="645" y1="280" x2="485" y2="340" stroke="#64748b" stroke-width="1.2"/>
    <line x1="645" y1="290" x2="485" y2="435" stroke="#64748b" stroke-width="1.2"/>
  </svg>
</body>
</html>
