# Render blueprint — one web service serving the API and both pages from a
# single origin, with Postgres.
#
# Deploy: Render dashboard → New → Blueprint → point at this repository, then
# paste ANTHROPIC_API_KEY into the service's environment (it is marked sync:
# false so it is never committed here).

services:
  - type: web
    name: synapse-buildos
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./docker/synapse.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SYNAPSE_DATABASE_URL
        fromDatabase:
          name: synapse-db
          property: connectionString
      # Signs the session tokens. Generated once, then kept — regenerating it
      # signs everyone out.
      - key: SYNAPSE_JWT_SECRET
        generateValue: true
      # Same-origin deployment: the browser never makes a cross-origin call.
      - key: SYNAPSE_CORS_ORIGINS
        value: ""
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: synapse-db
    plan: basic-256mb
    postgresMajorVersion: "16"
