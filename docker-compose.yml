# Synapse BuildOS — the whole thing on one machine:
#
#   SYNAPSE_JWT_SECRET=$(python -c "import secrets;print(secrets.token_urlsafe(48))") \
#   ANTHROPIC_API_KEY=sk-ant-... docker compose up --build
#
# Then open http://localhost:8000 — the landing page, the studio and the API
# are all on that one origin.
name: synapse

services:
  api:
    build:
      context: .
      dockerfile: docker/synapse.Dockerfile
    environment:
      SYNAPSE_DATABASE_URL: postgresql+psycopg://synapse:synapse@db:5432/synapse
      SYNAPSE_REDIS_URL: redis://cache:6379/0
      # Signs session tokens. Set it, or every restart signs everyone out.
      SYNAPSE_JWT_SECRET: ${SYNAPSE_JWT_SECRET:?set SYNAPSE_JWT_SECRET to a random 32+ character string}
      # Optional: without it the /cortex/* endpoints return 503 and the studio
      # falls back to its own rules engine.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SYNAPSE_CORS_ORIGINS: ""          # same origin, so no cross-origin calls
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
    volumes:
      - synapse_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  synapse_db:
